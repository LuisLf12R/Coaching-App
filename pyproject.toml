[project]
name = "garmin-api-coach"
version = "0.1.0"
description = "Backend-first coaching data platform for Garmin and future providers."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_api_coach"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
